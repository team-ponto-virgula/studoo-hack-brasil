body[data-direction=jornada]{--bg:#fff;--ink:#15275b;--muted:#50607a;--primary:#2457dd;--soft:#edf3ff;--line:#dfe7f2;--radius:24px}
body[data-direction=jornada] .primary{border-bottom:4px solid #173b9c;padding-top:10px;padding-bottom:10px;box-shadow:0 2px 0 #173b9c;letter-spacing:.015em}
body[data-direction=jornada] .primary:active{border-bottom-width:2px;transform:translateY(2px);box-shadow:none}
body[data-direction=jornada] .hero{padding:22px;background:#edf3ff;border:1.5px solid #d5e3ff}
body[data-direction=jornada] .hero-copy h2{font-size:1.5rem}
body[data-direction=jornada] .current-lesson{background:#2457dd;color:#fff;border-radius:24px;padding:22px;display:flex;gap:16px;align-items:center}
body[data-direction=jornada] .current-lesson .row-icon{background:#fff;color:#2457dd}
body[data-direction=jornada] .current-lesson small{display:block;color:#fff}
body[data-direction=jornada] .current-lesson h2{font-size:1.25rem;margin:4px 0}
body[data-direction=jornada] .map-node .node-dot{border-bottom-width:5px;box-shadow:0 3px 0 #dbe4f2}
body[data-direction=jornada] .map-node.current .node-dot{box-shadow:0 4px 0 #173b9c;outline:5px solid #e6edff;outline-offset:4px}
body[data-direction=jornada] .map-node:nth-of-type(2n){padding-left:38px}
body[data-direction=jornada] .map-node:nth-of-type(2n):not(:last-child)::after{left:70px}
body[data-direction=jornada] .map-node .node-copy{padding-left:2px}
body[data-direction=jornada] .map-node:not(:last-child)::after{width:4px;transform:rotate(-20deg);transform-origin:top;height:55px;top:72px}
body[data-direction=jornada] .map-node:nth-of-type(2n):not(:last-child)::after{transform:rotate(20deg)}
body[data-direction=jornada] .chapter{background:#e8f0ff;border:1px solid #d4e2ff}
body[data-direction=jornada] .screen[data-page=conclusao] .stats{padding:18px;background:#f1f5ff;border-radius:20px}
body[data-direction=jornada] .choice{border-width:2px;border-bottom-width:4px}
body[data-direction=jornada] .choice.selected{background:#edf3ff;border-color:#2457dd}
body[data-direction=jornada] .cover{box-shadow:inset 5px 0 0 #cbdcff;border:1px solid #d5e3ff}
body[data-direction=jornada] .screen[data-page=explorar] .row{padding:16px;border:1px solid #dfe7f2;border-bottom-width:3px;border-radius:20px;margin-bottom:10px}
body[data-direction=jornada] .tag{border:1px solid #d5e3ff}
body[data-direction=jornada] .feedback{border:1px solid currentColor}
@media(prefers-reduced-motion:reduce){body[data-direction=jornada] .primary:active{transform:none}}

/* Direção B · Caderno Claro. Estudo visual; não altera o app publicado. */
body[data-direction="caderno"] {
  --bg: #fbf7f0;
  --background: #fbf7f0;
  --surface: #ffffff;
  --paper: #ffffff;
  --ink: #172550;
  --text: #172550;
  --muted: #5c6275;
  --primary: #2455ce;
  --primary-dark: #173c99;
  --primary-soft: #edf2ff;
  --soft: #f3eee5;
  --line: #ded8cd;
  --stroke: #ded8cd;
  --field-line: #88867f;
  --success: #216b47;
  --success-soft: #edf7ef;
  --success-bg: #edf7ef;
  --danger: #a72c39;
  --danger-soft: #fff0ed;
  --error: #a72c39;
  --error-bg: #fff0ed;
  --radius: 20px;
  --card-radius: 20px;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
}

body[data-direction="caderno"] .app {
  background: var(--bg);
}

body[data-direction="caderno"] .topbar {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

body[data-direction="caderno"] .brand {
  max-width: none;
}

body[data-direction="caderno"] .screen h1,
body[data-direction="caderno"] .screen h2,
body[data-direction="caderno"] .screen h3 {
  color: var(--ink);
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: -0.035em;
}

body[data-direction="caderno"] .screen h1 {
  font-size: 1.875rem;
  line-height: 1.18;
}

body[data-direction="caderno"] .lead {
  color: var(--muted);
  font-size: 1.0625rem;
  line-height: 1.5;
}

body[data-direction="caderno"] .eyebrow,
body[data-direction="caderno"] .section-title {
  color: #244eab;
  font-size: 0.75rem;
  line-height: 1.5;
  font-weight: 900;
  letter-spacing: 0.065em;
}

body[data-direction="caderno"] .panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: none;
}

body[data-direction="caderno"] .hero {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px 22px 22px 6px;
  box-shadow: inset 5px 0 0 #b7caed;
}

body[data-direction="caderno"] .hero-copy {
  position: relative;
  z-index: 1;
}

body[data-direction="caderno"] .notebook-hero {
  min-height: 166px;
  padding: 22px 18px 22px 22px;
}

body[data-direction="caderno"] .notebook-hero .mascot {
  width: 86px;
  max-height: 112px;
}

body[data-direction="caderno"] .bookmark-row {
  padding: 14px 16px;
  color: var(--ink);
  background: var(--primary-soft);
  border: 0;
  border-radius: 16px;
}

body[data-direction="caderno"] .bookmark-row .row-icon {
  color: var(--primary-dark);
  background: var(--paper);
  border-radius: 5px 12px 12px 5px;
}

body[data-direction="caderno"] .bookmark-row .row-content small {
  color: #244eab;
  font-size: 0.75rem;
  margin-top: 0;
  margin-bottom: 4px;
}

body[data-direction="caderno"] .screen[data-page="inicio"] .hero::after,
body[data-direction="caderno"] .screen[data-page="conclusao"] .hero::after {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 27px;
  height: 27px;
  background: linear-gradient(225deg, var(--bg) 48%, #e6dfd2 50%);
  border-bottom-left-radius: 7px;
  pointer-events: none;
}

body[data-direction="caderno"] .primary {
  min-height: 52px;
  background: var(--primary);
  color: #ffffff;
  border: 1px solid var(--primary-dark);
  border-radius: 15px;
  box-shadow: 0 3px 0 var(--primary-dark);
  font-weight: 900;
  white-space: normal;
}

body[data-direction="caderno"] .primary:active {
  box-shadow: 0 1px 0 var(--primary-dark);
  transform: translateY(2px);
}

body[data-direction="caderno"] .primary.danger-action {
  color: #ffffff;
  background: var(--error);
  border-color: #82202c;
  box-shadow: 0 3px 0 #82202c;
}

body[data-direction="caderno"] .primary.danger-action:active {
  box-shadow: 0 1px 0 #82202c;
}

body[data-direction="caderno"] .secondary {
  min-height: 44px;
  color: var(--primary-dark);
  background: var(--paper);
  border-color: #a6b8d9;
  border-radius: 15px;
  box-shadow: none;
}

body[data-direction="caderno"] .quiet {
  min-height: 44px;
  color: var(--primary-dark);
}

body[data-direction="caderno"] .icon-button {
  min-width: 44px;
  min-height: 44px;
  color: var(--ink);
  border-color: transparent;
  background: transparent;
  border-radius: 14px;
}

body[data-direction="caderno"] .bottom-actions {
  background: var(--bg);
  border-top: 1px solid var(--line);
  box-shadow: none;
}

body[data-direction="caderno"] .bottom-nav {
  background: var(--paper);
  border-top: 1px solid var(--line);
  box-shadow: none;
}

body[data-direction="caderno"] .nav-item {
  color: var(--muted);
  border-radius: 15px;
}

body[data-direction="caderno"] .nav-item[aria-current="page"],
body[data-direction="caderno"] .nav-item.active {
  color: var(--primary-dark);
  background: var(--primary-soft);
}

body[data-direction="caderno"] .field,
body[data-direction="caderno"] .textarea {
  color: var(--ink);
  background: var(--paper);
  border-color: var(--field-line);
  border-radius: 15px;
  box-shadow: none;
}

body[data-direction="caderno"] .field::placeholder,
body[data-direction="caderno"] .textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

body[data-direction="caderno"] .field-label {
  color: var(--ink);
  font-weight: 800;
}

body[data-direction="caderno"] :is(button, a, input, textarea, select):focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
}

body[data-direction="caderno"] .chip,
body[data-direction="caderno"] .tag {
  color: #244eab;
  background: var(--primary-soft);
  border-color: #bdcce8;
  border-radius: 10px;
}

body[data-direction="caderno"] button.chip {
  min-height: 44px;
}

body[data-direction="caderno"] .chapter {
  color: var(--primary-dark);
  background: transparent;
  border: 0;
  border-bottom: 1px solid #bfcee6;
  border-radius: 0;
  padding-left: 0;
  padding-right: 0;
  box-shadow: none;
}

body[data-direction="caderno"] .map {
  position: relative;
}

body[data-direction="caderno"] .lesson-step {
  position: relative;
  border-radius: 16px;
}

body[data-direction="caderno"] .map-node {
  min-height: 94px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 4px 16px 16px 4px;
  box-shadow: none;
}

body[data-direction="caderno"] .map-node.current,
body[data-direction="caderno"] .map-node[data-state="current"] {
  color: var(--ink);
  background: var(--paper);
  box-shadow: inset 3px 0 0 #b7caed;
}

body[data-direction="caderno"] .map-node.done,
body[data-direction="caderno"] .map-node[data-state="done"] {
  color: var(--ink);
  background: transparent;
  box-shadow: none;
}

body[data-direction="caderno"] .map-node .node-dot {
  width: 52px;
  height: 52px;
  color: var(--primary-dark);
  background: var(--paper);
  border: 1px solid #a8bce0;
  border-radius: 14px;
  box-shadow: 0 2px 0 #d3dcec;
}

body[data-direction="caderno"] .map-node.current .node-dot {
  color: #ffffff;
  background: var(--primary);
  border-color: var(--primary-dark);
  box-shadow: 0 3px 0 var(--primary-dark);
}

body[data-direction="caderno"] .map-node.done .node-dot {
  color: var(--success);
  background: var(--success-soft);
  border-color: #b6cfbb;
  box-shadow: none;
}

body[data-direction="caderno"] .map-notebook .map-node:not(:last-child)::after {
  left: 29px;
  top: 68px;
  width: 2px;
  background: #cdd7e9;
}

body[data-direction="caderno"] .map-notebook .map-node:has(+ .route-section)::after {
  display: none;
}

body[data-direction="caderno"] .map-notebook .route-section {
  padding-top: 14px;
  padding-bottom: 6px;
  color: #244eab;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
}

body[data-direction="caderno"] .node-copy strong {
  color: var(--ink);
  font-family: Quicksand, Nunito, sans-serif;
  font-size: 1.0625rem;
  font-weight: 700;
}

body[data-direction="caderno"] .map-node:disabled {
  color: #616576;
  background: #f0ede7;
  border-color: #d0cdc6;
  box-shadow: none;
  opacity: 1;
}

body[data-direction="caderno"] .step-name {
  color: var(--ink);
  font-weight: 900;
}

body[data-direction="caderno"] .plan-list {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 0 16px;
}

body[data-direction="caderno"] .plan-list .row {
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

body[data-direction="caderno"] .plan-list .row:last-child {
  border-bottom: 0;
}

body[data-direction="caderno"] .row-icon {
  color: var(--primary-dark);
  background: var(--primary-soft);
  border-radius: 12px;
}

body[data-direction="caderno"] .source-card,
body[data-direction="caderno"] .material-file {
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 4px solid #a1b9e4;
  border-radius: 4px 15px 15px 4px;
  box-shadow: none;
}

body[data-direction="caderno"] .note {
  color: var(--muted);
  background: var(--soft);
  border-color: transparent;
  border-radius: 14px;
}

body[data-direction="caderno"] .code {
  color: #173c77;
  background: #eef3fc;
  border: 1px solid #c8d6ee;
  border-radius: 14px;
  box-shadow: none;
}

body[data-direction="caderno"] .choice {
  color: var(--ink);
  background: var(--paper);
  border-color: #aaa59c;
  border-radius: 14px;
  box-shadow: none;
}

body[data-direction="caderno"] .choice.selected,
body[data-direction="caderno"] .choice[aria-pressed="true"],
body[data-direction="caderno"] .choice[aria-checked="true"] {
  color: var(--primary-dark);
  background: var(--primary-soft);
  border: 2px solid var(--primary);
}

body[data-direction="caderno"] .feedback.correct,
body[data-direction="caderno"] .correct {
  color: var(--success);
  background: var(--success-soft);
  border-color: #accab4;
}

body[data-direction="caderno"] .feedback.incorrect,
body[data-direction="caderno"] .incorrect {
  color: var(--danger);
  background: var(--danger-soft);
  border-color: #d6a7a4;
}

/* C · Foco Vivo. Camada de desenho; não altera o produto ou os contratos. */
body[data-direction="foco"] {
  --bg: #f5f7fc;
  --surface: #ffffff;
  --ink: #11215c;
  --muted: #53627d;
  --primary: #2658d9;
  --brand: var(--primary);
  --primary-deep: #163b9b;
  --hero: #14245c;
  --line: #dce2ef;
  --control-line: #7b89a5;
  --soft: #e9eeff;
  --success: #194f3b;
  --success-bg: #eaf5ee;
  --error: #8f351e;
  --error-bg: #fff0e9;
  --radius: 18px;
  background: var(--bg);
  color: var(--ink);
  font-family: "Nunito", sans-serif;
}

body[data-direction="foco"] .app {
  background: var(--bg);
}

body[data-direction="foco"] .topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: none;
}

body[data-direction="foco"] :is(h1, h2, h3, .section-title, .step-name) {
  color: var(--ink);
  font-family: "Nunito", sans-serif;
  letter-spacing: -0.035em;
  font-weight: 850;
}

body[data-direction="foco"] h1 {
  font-size: 1.875rem;
  line-height: 1.16;
}

body[data-direction="foco"] h2 {
  font-size: 1.375rem;
  line-height: 1.24;
}

body[data-direction="foco"] h3 {
  font-size: 1.125rem;
  line-height: 1.3;
}

body[data-direction="foco"] .eyebrow {
  color: var(--primary-deep);
  font-size: 0.75rem;
  line-height: 1.4;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 900;
}

body[data-direction="foco"] .lead {
  color: var(--muted);
  font-size: 1.0625rem;
  line-height: 1.5;
}

body[data-direction="foco"] .panel {
  background: var(--surface);
  border: 0;
  border-radius: var(--radius);
  box-shadow: none;
  padding: 20px;
}

body[data-direction="foco"] .panel .panel {
  background: transparent;
  border-radius: 0;
  padding: 0;
}

body[data-direction="foco"] .hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  background: var(--hero);
  color: #ffffff;
  border: 0;
  border-radius: 24px;
  padding: 24px 22px;
  box-shadow: none;
}

body[data-direction="foco"] .hero-copy {
  min-width: 0;
}

body[data-direction="foco"] .hero :is(h1, h2, h3, .eyebrow, .lead, p) {
  color: #ffffff;
}

body[data-direction="foco"] .hero :is(.eyebrow, .lead) {
  opacity: 0.9;
}

body[data-direction="foco"] .hero .mascot {
  width: 82px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

body[data-direction="foco"] .hero .tag {
  color: #ffffff;
  background: #2c3d73;
  border: 0;
}

body[data-direction="foco"] .focus-hero {
  grid-template-columns: minmax(0, 1fr);
  gap: 0;
}

body[data-direction="foco"] .focus-hero .primary {
  color: var(--ink);
  background: var(--surface);
}

body[data-direction="foco"] .focus-hero .primary:active {
  background: var(--soft);
}

body[data-direction="foco"] .focus-progress .progress-label {
  color: #ffffff;
}

body[data-direction="foco"] .focus-progress .progress {
  background: #52638d;
}

body[data-direction="foco"] .focus-progress .progress > span {
  background: #ffffff;
}

body[data-direction="foco"] :is(.primary, .secondary, .quiet, .icon-button, .choice, .chip) {
  -webkit-tap-highlight-color: transparent;
}

body[data-direction="foco"] .primary {
  min-height: 52px;
  background: var(--primary);
  color: #ffffff;
  border: 0;
  border-radius: 14px;
  box-shadow: none;
  font-size: 1rem;
  line-height: 1.35;
  font-weight: 900;
  letter-spacing: -0.01em;
}

body[data-direction="foco"] .primary:active {
  background: var(--primary-deep);
  transform: translateY(1px);
}

body[data-direction="foco"] .secondary {
  min-height: 48px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--control-line);
  border-radius: 14px;
  box-shadow: none;
  font-size: 1rem;
  line-height: 1.35;
  font-weight: 800;
}

body[data-direction="foco"] .quiet {
  color: var(--primary-deep);
  min-height: 44px;
  border-radius: 12px;
  font-size: 0.9375rem;
  font-weight: 850;
}

body[data-direction="foco"] .icon-button {
  min-width: 44px;
  min-height: 44px;
  background: transparent;
  color: var(--ink);
  border: 0;
  border-radius: 12px;
}

body[data-direction="foco"] :is(button, a, input, textarea, select):focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 4px;
}

body[data-direction="foco"] .primary:focus-visible {
  outline-color: var(--ink);
  box-shadow: 0 0 0 2px var(--surface);
}

body[data-direction="foco"] .bottom-actions {
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: none;
}

body[data-direction="foco"] .bottom-nav {
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: none;
}

body[data-direction="foco"] .nav-item {
  color: var(--muted);
  border-radius: 14px;
  font-size: 0.75rem;
  line-height: 1.3;
  font-weight: 850;
  min-width: 0;
  overflow-wrap: anywhere;
}

body[data-direction="foco"] .nav-item:is(.selected, .active, [aria-current="page"]) {
  color: var(--primary-deep);
  background: var(--soft);
}

body[data-direction="foco"] :is(.field, .textarea) {
  background: var(--surface);
  color: var(--ink);
  border: 1.5px solid var(--control-line);
  border-radius: 14px;
  font-family: "Nunito", sans-serif;
  font-size: 1.0625rem;
  line-height: 1.5;
}

body[data-direction="foco"] :is(.field, .textarea)::placeholder {
  color: var(--muted);
  opacity: 1;
}

body[data-direction="foco"] .field-label {
  color: var(--ink);
  font-size: 0.875rem;
  font-weight: 900;
}

body[data-direction="foco"] .list {
  background: transparent;
  gap: 0;
}

body[data-direction="foco"] .row {
  background: transparent;
  color: var(--ink);
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
  min-height: 72px;
  padding: 16px 0;
}

body[data-direction="foco"] .row:last-child {
  border-bottom: 0;
}

body[data-direction="foco"] .row-icon {
  background: var(--soft);
  color: var(--primary-deep);
  border-radius: 13px;
}

body[data-direction="foco"] .row-content {
  min-width: 0;
}

body[data-direction="foco"] .library-row .cover {
  width: 52px;
  height: 52px;
}

body[data-direction="foco"] .chip {
  background: var(--surface);
  color: var(--primary-deep);
  border: 1px solid var(--control-line);
  border-radius: 12px;
  font-size: 0.875rem;
  font-weight: 800;
}

body[data-direction="foco"] .chip:is(.selected, [aria-pressed="true"]) {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}

body[data-direction="foco"] .choice {
  background: var(--surface);
  color: var(--ink);
  border: 1.5px solid var(--control-line);
  border-radius: 14px;
  box-shadow: none;
  min-height: 58px;
  padding: 14px;
  font-size: 1rem;
  line-height: 1.4;
}

body[data-direction="foco"] .choice:is(.selected, [aria-checked="true"], [aria-pressed="true"]) {
  background: var(--soft);
  border-color: var(--primary);
  box-shadow: inset 0 0 0 0.5px var(--primary);
}

body[data-direction="foco"] .chapter {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding-bottom: 16px;
}

body[data-direction="foco"] .step-name {
  font-size: 1.0625rem;
  line-height: 1.35;
}

body[data-direction="foco"] .lesson-step {
  border-color: var(--line);
  box-shadow: none;
}

body[data-direction="foco"]:has(.screen:is([data-page="licao"], [data-page="exercicio"])) .topbar > .progress {
  display: none;
}

body[data-direction="foco"] .map-focus .route-section {
  margin-top: 12px;
  margin-bottom: 4px;
}

body[data-direction="foco"] .map-focus .map-node {
  min-height: 92px;
  border-bottom: 1px solid var(--line);
  padding: 14px 12px;
  gap: 14px;
}

body[data-direction="foco"] .map-focus .map-node::after {
  display: none;
}

body[data-direction="foco"] .map-focus .node-dot {
  width: 44px;
  height: 44px;
  border-radius: 13px;
}

body[data-direction="foco"] .map-focus .map-node.current {
  background: var(--surface);
  border: 1.5px solid var(--primary);
  border-radius: var(--radius);
  margin: 8px 0;
}

body[data-direction="foco"] .map-focus .node-copy strong {
  font-size: 1.0625rem;
  font-weight: 900;
}

body[data-direction="foco"] .completion-next {
  background: var(--surface);
  border: 0;
  border-left: 3px solid var(--primary);
  border-radius: 0 16px 16px 0;
}

body[data-direction="foco"] .stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
  gap: 12px;
  background: transparent;
  border: 0;
  border-radius: 0;
}

body[data-direction="foco"] .metric {
  background: transparent;
  border: 0;
  border-left: 2px solid var(--line);
  border-radius: 0;
  padding-left: 12px;
}

body[data-direction="foco"] .metric:first-child {
  border-left-color: var(--primary);
}

body[data-direction="foco"] .code {
  background: #edf1fa;
  color: var(--ink);
  border: 0;
  border-left: 3px solid var(--primary);
  border-radius: 12px;
  padding: 16px;
  font-size: 0.875rem;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

body[data-direction="foco"] .feedback {
  border: 0;
  border-radius: 16px;
  padding: 16px;
  box-shadow: none;
}

body[data-direction="foco"] :is(.feedback.correct, .feedback.success) {
  color: var(--success);
  background: var(--success-bg);
}

body[data-direction="foco"] :is(.feedback.incorrect, .feedback.error) {
  color: var(--error);
  background: var(--error-bg);
}

body[data-direction="foco"] .source-card {
  background: var(--surface);
  color: var(--muted);
  border: 0;
  border-left: 3px solid var(--line);
  border-radius: 0 14px 14px 0;
  box-shadow: none;
  padding: 16px;
}

body[data-direction="foco"] :is(.note, .study-meta) {
  color: var(--muted);
  font-size: 0.875rem;
  line-height: 1.5;
}

body[data-direction="foco"] .tag {
  background: var(--soft);
  color: var(--primary-deep);
  border: 0;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 900;
  line-height: 1.4;
}

body[data-direction="foco"] .material-file {
  background: var(--surface);
  border: 1px solid var(--control-line);
  border-radius: 16px;
  padding: 16px;
}

body[data-direction="foco"] .cover {
  border-radius: 14px;
  background: var(--soft);
  color: var(--primary-deep);
}

body[data-direction="foco"] .avatar {
  background: var(--soft);
  color: var(--primary-deep);
  border: 0;
  border-radius: 50%;
}

body[data-direction="foco"] .profile-cover {
  display: none;
}

body[data-direction="foco"] .profile-head.covered {
  padding: 20px;
  background: var(--hero);
  color: #ffffff;
  border-radius: 22px;
  gap: 14px;
}

body[data-direction="foco"] .profile-head.covered :is(h1, p, .icon-button) {
  color: #ffffff;
}

body[data-direction="foco"] .profile-head.covered > div {
  min-width: 0;
}

body[data-direction="foco"] .profile-head.covered h1 {
  overflow-wrap: anywhere;
}

body[data-direction="foco"] .profile-head.covered .avatar {
  width: 64px;
  height: 64px;
  flex-shrink: 0;
  background: var(--soft);
  color: var(--ink);
  border: 3px solid #ffffff;
}

body[data-direction="foco"] .share-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: none;
}

body[data-direction="foco"] .dialog {
  background: var(--surface);
  color: var(--ink);
  border: 0;
  border-radius: 24px;
}

body[data-direction="foco"] .screen[data-page="conclusao"] > .mascot {
  width: 92px;
  height: 92px;
  object-fit: contain;
}

@media (max-width: 374px) {

  }

  body[data-direction="foco"] .hero {
    gap: 8px;
    padding: 20px 18px;
  }

  body[data-direction="foco"] .hero .mascot {
    width: 68px;
  }

  body[data-direction="foco"] .panel {
    padding: 18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  body[data-direction="foco"] *,
  body[data-direction="foco"] *::before,
  body[data-direction="foco"] *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

.media-photo-editor,.media-code-card{min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.media-photo-surface{width:min(100%,14rem);aspect-ratio:1;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.media-photo-surface[data-shape=circle]{border-radius:50%}
.media-photo-surface[data-shape=rounded]{border-radius:22%}
.media-photo-image{width:100%;height:100%;display:block;object-fit:cover;transform-origin:center}
.media-photo-initial{font-family:Quicksand,Nunito,sans-serif;font-size:4rem;font-weight:700;color:var(--primary)}
.media-photo-caption{text-align:center;overflow-wrap:anywhere}
.media-photo-source-actions{display:flex;flex-direction:column;gap:6px;min-width:0}
.media-control-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.media-control-label .field-label{margin:0}
.media-control-label output{font-size:.875rem;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.media-zoom-controls{display:flex;flex-direction:column;gap:8px;min-width:0}
.media-zoom-row{display:flex;align-items:center;gap:12px;min-width:0}
.media-zoom-row .media-zoom-button{width:48px;min-width:48px;min-height:48px;flex:0 0 48px;padding:8px;font-size:1.25rem}
.media-range{flex:1;min-width:0;width:100%;height:44px;margin:0;accent-color:var(--primary);background:transparent;touch-action:pan-y}
.media-shape-options{border:0;padding:0;margin:0;min-width:0}
.media-shape-options legend{padding:0}
.media-shape-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:10px;min-width:0}
.media-shape-grid [aria-pressed=true]{background:var(--soft);border-color:var(--primary);color:var(--primary)}
.media-code-brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%;min-width:0}
.media-code-brand img{width:96px;height:auto}
.media-code-brand .tag{max-width:100%;white-space:normal}
.media-code-card h2{align-self:flex-start;overflow-wrap:anywhere;min-width:0;max-width:100%}
.media-qr{width:min(100%,18rem);display:flex;justify-content:center;background:#fff;border-radius:12px;overflow:hidden}
.media-qr svg{display:block;width:100%;height:auto;max-width:100%;flex-shrink:1}
.media-example-warning{font-size:.8125rem;color:var(--muted);max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.5}
.media-example-link{font-size:.875rem;min-width:0;max-width:100%}
.media-share-dialog{min-width:0}
.media-share-dialog .primary,.media-share-dialog .secondary,.media-share-dialog .quiet{margin-top:12px;overflow-wrap:anywhere}
.avatar:has(img[data-media-photo]){overflow:hidden}
.avatar img[data-media-photo]{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center}
@media(max-width:374px){.media-photo-editor,.media-code-card{padding:16px}.media-code-brand{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.media-photo-image{transition:none!important}}

/* Componentes compartilhados pelas três direções; sem cores que substituam os temas. */
.report-context{display:flex;align-items:flex-start;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.report-context>svg{color:var(--primary);flex:0 0 24px;margin-top:2px}
.report-context>div{min-width:0;flex:1}
.report-context strong{display:block;overflow-wrap:anywhere;line-height:1.4}
.report-context small{display:block;margin-top:4px;font-size:.8125rem;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.report-options,.publication-visibility{display:flex;flex-direction:column;gap:10px;min-width:0}
.report-options h2,.publication-visibility h2{font-size:1.0625rem;margin-bottom:2px;overflow-wrap:anywhere}
.report-option,.publication-option{display:flex;align-items:flex-start;gap:12px;min-height:56px;width:100%;max-width:100%;padding:14px 16px;border:1.5px solid #8996b1;border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;font-size:1rem;line-height:1.45;font-weight:800}
.report-option>span:last-child,.publication-option>span:last-child{min-width:0;flex:1;overflow-wrap:anywhere}
.report-option[aria-pressed=true],.publication-option[aria-pressed=true]{border:2px solid var(--primary);background:var(--soft);color:var(--ink)}
.report-option-mark{width:24px;height:24px;border:2px solid #8996b1;border-radius:50%;flex:0 0 24px;margin-top:0}
.report-option[aria-pressed=true]>.report-option-mark,.publication-option[aria-pressed=true]>.report-option-mark{border:7px solid var(--primary)}
.publication-option strong{display:block;font-size:1rem;line-height:1.4}
.publication-option small{display:block;margin-top:3px;color:var(--muted);font-size:.8125rem;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.report-optional{font-size:.8125rem;font-weight:600;color:var(--muted)}
.report-helper{margin-top:6px;font-size:.8125rem;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.report-details{min-height:112px;max-width:100%}
.report-summary{padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow-wrap:anywhere;display:flex;flex-direction:column;gap:10px}
.report-summary h2{font-size:1.125rem;line-height:1.4}
.report-summary p{white-space:pre-wrap;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.report-confirmed{display:flex;align-items:flex-start;gap:14px;padding:20px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);min-width:0}
.report-confirmed>svg{flex:0 0 28px;width:28px;height:28px;margin-top:2px}
.report-confirmed>div{min-width:0;flex:1}
.report-confirmed h2{font-size:1.125rem;line-height:1.4}
.report-confirmed p{font-size:.9375rem;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}
.report-confirmed .report-protocol{font-size:1.125rem;font-weight:900;letter-spacing:.01em;overflow-wrap:anywhere}
.publication-note{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--soft);color:var(--ink);border-radius:16px;min-width:0}
.publication-note>svg{flex:0 0 22px;width:22px;height:22px;color:var(--primary);margin-top:2px}
.publication-note p{flex:1;min-width:0;font-size:.9375rem;line-height:1.5;overflow-wrap:anywhere}
.publication-status{display:flex;align-items:flex-start;gap:14px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);color:var(--ink);min-width:0}
.publication-status>svg{width:24px;height:24px;flex:0 0 24px;color:var(--primary);margin-top:2px}
.publication-status>div{flex:1;min-width:0}
.publication-status h2{font-size:1.125rem;line-height:1.4;overflow-wrap:anywhere}
.publication-status p{font-size:.9375rem;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}
.publication-status.publication-erro{background:var(--error-bg);color:var(--error);border-color:var(--error)}
.publication-status.publication-erro>svg{color:var(--error)}
.publication-status.publication-aprovado{background:var(--success-bg);color:var(--success);border-color:transparent}
.publication-status.publication-aprovado>svg{color:var(--success)}
.publication-rules{font-size:.875rem;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.publication-rules button{font:inherit;font-weight:900;min-height:44px;min-width:44px;border:0;background:transparent;color:var(--primary);text-decoration:underline;text-underline-offset:3px;padding:8px 0;white-space:normal;text-align:left}
.screen[data-page=denunciar],.screen[data-page=compartilhar]{min-width:0}
@media(prefers-reduced-motion:reduce){.report-option,.publication-option{transition:none;animation:none}}

/* Correções compartilhadas depois dos temas: sem alterar o foco dos controles. */
h1[tabindex="-1"]:focus{outline:none}
.toggle{min-width:56px;min-height:44px;width:56px;height:44px;padding:0;border:0;background:transparent!important;position:relative;flex-shrink:0}
.toggle::before{content:'';position:absolute;left:4px;top:8px;width:48px;height:28px;border-radius:20px;background:#6b7891}
.toggle::after{content:'';position:absolute;left:7px;top:11px;width:22px;height:22px;border-radius:50%;background:#fff;transform:none}
.toggle[aria-checked=true]::before{background:var(--primary)}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.row .quiet{width:auto;flex-shrink:0}
.danger-action{background:var(--error);color:#fff;border-bottom-color:var(--error)!important}
html[data-reduced=true] *,html[data-reduced=true] *::before,html[data-reduced=true] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html[data-reduced=true] .primary:active{transform:none}
/* Reflow em 200% e nomes longos: quebrar conteúdo, nunca escondê-lo. */
h1,h2,h3,.row-content,.hero-copy,.node-copy{overflow-wrap:anywhere;min-width:0}
.title-group,.profile-head,.section-title,.chips,.stats,.metric{min-width:0;max-width:100%}
.profile-head>div:not(.avatar){min-width:0;flex:1}
.profile-head .tag{max-width:100%;white-space:normal;display:inline-block;overflow-wrap:anywhere}
.section-title{flex-wrap:wrap}
.section-title h2{min-width:0;flex:1 1 10rem}
.section-title>.tag{max-width:100%;flex:0 1 auto}
.chip{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.form-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr))}
body[data-direction] .stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,6rem),1fr))}
.metric span{overflow-wrap:anywhere}
.topbar>.progress{display:none}
body[data-direction=jornada] .map-node:has(+.route-section)::after{display:none}
.recording-panel{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:28px 20px;background:var(--soft);border-radius:var(--radius)}
.recording-panel>svg{width:44px;height:44px;color:var(--primary)}
.recording-panel p{font-size:.875rem;color:var(--muted)}
.record-time{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}
.review-note{background:#fff4d7;color:#654b15}
.profile-photo{width:80px;height:80px;object-fit:cover;border-radius:24px;flex-shrink:0}
.profile-edit-interests{display:flex;flex-direction:column;gap:8px}
.color-choice{display:flex;align-items:center;gap:8px}
.color-dot{width:18px;height:18px;border-radius:50%;background:var(--primary);flex-shrink:0}
.color-dot[data-hue=lilas]{background:#7355ba}.color-dot[data-hue=verde]{background:#28785a}
.avatar-photo{overflow:hidden;padding:0}
.avatar-photo[data-shape=circle]{border-radius:50%}
.avatar-photo img{width:100%;height:100%;object-fit:cover;max-width:none}
.profile-cover[data-hue=lilas]{background:#eee9fa}.profile-cover[data-hue=verde]{background:#e7f3ec}

var qrcode = function() {

function go(dest,opts={}){

  if(dest==='exercicio'&&lessonIndex()>0)opts.f='multipla';

function mapContent(done){let out='';lessons.forEach((l,i)=>{const review=state.reviewNeeded.includes(i)||(scenario==='vale-rever'&&i===0);if(i===0||lessons[i-1][2]!==l[2])out+=`<div class="route-section">${l[2]}</div>`;out+=`<button class="map-node ${i<done?'done':i===done?'current':'locked'}" data-lesson="${i}" aria-label="${esc(l[0])}: ${i<done?(review?'concluída, vale rever':'concluída, rever'):i===done?'próxima, começar':'bloqueada'}"><span class="node-dot">${icon(i<done?'check':i===done?'book':'lock')}</span><span class="node-copy"><strong>${l[0]}</strong><small>${l[1]}</small>${i<done?(review?'<span class="tag review-note">Vale rever</span>':'<small>Concluída</small>'):i===done?'<span class="tag">Seu próximo passo</span>':''}</span>${i===done?icon('arrow'):''}</button>`;});return `<div class="map ${direction==='jornada'?'map-journey':direction==='caderno'?'map-notebook':'map-focus'}">${out}</div>`;}

function exerciseContent(){const current=course[lessonIndex()];let c=title('Sua vez',lessonIndex()>0?current.question:FORMATS[format],lessonIndex()>0?'Leia a consulta e encontre a correspondência.':format==='lacuna'?'Liste os alunos com nota de pelo menos 7.':'Use a ideia do limite para resolver.');
 if(lessonIndex()>0)c+=`<p>${esc(current.example)}</p><pre class="code">${esc(current.code)}</pre><div class="list">${current.options.map(([t,v])=>choice(esc(t),v)).join('')}</div>`;
 else if(format==='lacuna')c+=`<p>Ana tem 6, Bia tem 7 e Caio tem 9.</p><pre class="code">SELECT nome FROM alunos\nWHERE nota <strong>___</strong> 7;</pre><div class="form-grid">${['>','>=','<','<='].map(x=>choice(esc(x),x)).join('')}</div>`;

 else if(format==='ordenar')c+=`<p>Organize os passos para encontrar alunos com nota de pelo menos 7.</p><div class="list">${state.order.map((x,i)=>`<div class="row"><span class="row-content"><strong>${i+1}. ${x}</strong></span>${ib('up','Mover '+x+' para cima','move-up-'+i)}${ib('down','Mover '+x+' para baixo','move-down-'+i)}</div>`).join('')}</div><p id="ordering-status" class="flow-description" role="status" aria-live="polite">Use as setas. Não é necessário arrastar.</p>`;
 else if(format==='associar')c+=`<div class="stack">${[['Maior que','gt'],['Maior ou igual','gte'],['Menor ou igual','lte']].map(([l,k])=>`<div><label class="field-label" for="pair-${k}">${l}</label><select id="pair-${k}" data-pair="${k}"><option value="">Selecione</option>${['>','>=','<='].map(v=>`<option value="${esc(v)}" ${state.pairs[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('')}</div>`;
 else if(format==='verdadeiro')c+=`<div class="panel"><p>“A condição nota &gt;= 7 inclui quem tem nota exatamente 7.”</p></div><div class="form-grid">${choice('Verdadeiro','v')}${choice('Falso','f')}</div><div><label class="field-label" for="reason">Por quê?</label><textarea id="reason" class="textarea" placeholder="Pense no sinal de igual.">${esc(state.reason||'')}</textarea></div>`;
 else c+=`<div class="panel"><p>Como você escreveria uma condição para incluir alunos com nota exatamente 7 ou maior?</p></div><div><label class="field-label" for="open-answer">Sua resposta</label><textarea id="open-answer" class="textarea" placeholder="Eu usaria…">${esc(state.openAnswer||'')}</textarea></div><p class="flow-description">Critérios: escolher &gt;= e explicar a inclusão do valor 7.</p>`;

 else if(scenario==='erro')c+=`<div class="feedback incorrect" role="alert"><h2>${icon('repeat')}Vamos olhar de novo.</h2><p>${esc(current.wrong)}</p></div>`;

function completionContent(){const n=Math.min(state.completed,4),l=course[lessonIndex()],review=state.reviewNeeded.includes(lessonIndex())||scenario==='vale-rever';let lead=review?'Um passo para rever.':state.completed>=5?'Um caminho construído.':direction==='caderno'?'Mais uma página entendida.':direction==='foco'?'Uma ideia que ficou.':'Um passo bem entendido!';return `${direction==='jornada'?mascot('comemorando','big'):'<div class="completion-mark">'+icon('check')+'</div>'}${title(state.completed>=5?'Trilha concluída':'Lição concluída',lead,'Você praticou '+l.goal+'.')}<div class="save-line">${icon('check')}Progresso confirmado · exemplo local</div>${progress(Math.max(state.completed,1),5)}${review?'<div class="note review-note">'+icon('repeat')+'<span><strong>Vale rever.</strong> Você escolheu seguir sem acertar. Volte a esta lição quando quiser para rever a ideia.</span></div>':''}${state.completed>=5?note('Você pode rever qualquer lição e criar um novo caminho.','book'):`<div class="completion-next"><span class="row-icon">${icon('book')}</span><div><small>Próximo passo</small><strong>${lessons[n][0]}</strong><small>${lessons[n][1]}</small></div>${icon('arrow')}</div>`}<div class="note">${icon('spark')}<span><strong>Leve esta ideia:</strong> ${esc(l.detail)}</span></div><div class="stats"><div class="metric"><strong>${Math.max(state.completed,1)}</strong><span>de 5 lições</span></div><div class="metric"><strong>SQL</strong><span>na prática</span></div><div class="metric"><strong>Seu</strong><span>próximo passo</span></div></div>`;}

<svg xmlns="http://www.w3.org/2000/svg" width="140" height="46" viewBox="0 0 140 46">
  <title>Studoo</title>
  <style>
    .marca { animation: flutuar 3s ease-in-out infinite; }
    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @media (prefers-reduced-motion: reduce) { .marca { animation: none; } }
  </style>
  <image class="marca" width="140" height="46" href="data:image/png;base64,"/>
</svg>

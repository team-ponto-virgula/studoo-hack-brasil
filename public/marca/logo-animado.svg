<svg xmlns="http://www.w3.org/2000/svg" width="140" height="46" viewBox="0 0 140 46">
  <title>Studoo</title>
  <style>
    .sorriso { animation: aparecer 260ms ease-out both; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sorriso { animation: none; } }
  </style>
  <defs>
    <image id="marca" width="140" height="46" href="data:image/png;base64,"/>
    <clipPath id="palavra"><rect width="140" height="34.5"/></clipPath>
    <clipPath id="sorriso"><rect y="34.5" width="140" height="11.5"/></clipPath>
  </defs>
  <use href="#marca" clip-path="url(#palavra)"/>
  <use class="sorriso" href="#marca" clip-path="url(#sorriso)"/>
</svg>

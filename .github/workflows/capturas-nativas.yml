# Conferência nativa do app: roda o Studoo num simulador de iPhone, pelo Expo Go, e num emulador de Android, com o build
# de debug do projeto, e guarda as capturas das telas (os dois jobs rodam em paralelo, um não espera o outro).
#
# É um workflow à parte da verificação do PR (`verificacao.yml`): nada aqui é obrigatório, e ele não entra na fila dela.
# Dados: a API do próprio repositório, nesta máquina, com IA simulada e uma conta sintética de senha sorteada a cada
# execução. Nenhum segredo e nada do site publicado. O passo a passo está em `apps/mobile/conferencia-nativa/`.
name: Capturas nativas

on:
  workflow_dispatch:
    inputs:
      aparelho:
        description: Aparelho do simulador
        default: iPhone 17 Pro
        required: true
      ios:
        description: Versão do iOS (por exemplo 26.5)
        default: "26.5"
        required: true
  push:
    branches: [feat/hackathon-integracao]
    paths:
      - "apps/mobile/**"
      - "packages/contratos/**"
      - ".github/workflows/capturas-nativas.yml"

permissions:
  contents: read

# Uma conferência por vez no mesmo ramo. A que está rodando vai até o fim: cancelada no meio, ela não deixa capturas nem
# registros, e a máquina gasta à toa. Um envio novo espera na fila (só o mais novo da fila fica).
concurrency:
  group: capturas-nativas-${{ github.ref }}
  cancel-in-progress: false

env:
  # Maestro: versão e sha256 do maestro.zip publicado em github.com/mobile-dev-inc/Maestro/releases (cli-<versão>). Vale
  # para os dois jobs.
  MAESTRO_VERSAO: 2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7

jobs:
  iphone:
    name: iPhone (simulador)
    # macOS 26 arm64 fixo, e não `macos-latest`: a lista de simuladores não muda sozinha quando o rótulo mudar de sistema.
    runs-on: macos-26
    # Folga sobre a soma do que cada passo costuma levar (uns 55 minutos na execução 44511779137, antes da cache do Metro):
    # o tempo de cada passo estoura antes deste, e um passo que estoura é falha comum, com capturas e registros guardados.
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      CONFERENCIA_APARELHO: ${{ inputs.aparelho || 'iPhone 17 Pro' }}
      CONFERENCIA_IOS: ${{ inputs.ios || '26.5' }}
      # Expo Go de simulador para o SDK 58 (a versão que https://api.expo.dev/v2/versions/latest indica). Ao subir o SDK
      # do app, troque o endereço e o sha256 juntos.
      EXPO_GO_IOS_URL: https://github.com/expo/expo-go-releases/releases/download/Expo-Go-58.0.7/Expo-Go-58.0.7.tar.gz
      EXPO_GO_IOS_SHA256: 17ab20f856c72690a750e79826ab5c90550a1441b1d1d67db6cd252af979b903

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Segundos, sem simulador: um `testID` que mudou no app e ficou para trás num fluxo aparece aqui.
      - name: Conferir os fluxos contra o código do app
        run: node apps/mobile/conferencia-nativa/conferir-fluxos.mjs

      - name: Sonda (versões, simuladores e o aparelho escolhido)
        id: sonda
        run: bash apps/mobile/conferencia-nativa/ios.sh sonda

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Ligar o simulador (segue em segundo plano)
        run: bash apps/mobile/conferencia-nativa/ios.sh ligar

      - name: Instalar dependências
        run: npm ci

      - name: API local (banco, build, HTTPS e dados de demonstração)
        id: servidor
        timeout-minutes: 20
        run: bash apps/mobile/conferencia-nativa/ios.sh servidor

      - name: Simulador pronto (CA local e Expo Go)
        id: simulador
        timeout-minutes: 15
        run: bash apps/mobile/conferencia-nativa/ios.sh simulador

      - name: Maestro
        id: maestro
        timeout-minutes: 5
        run: bash apps/mobile/conferencia-nativa/ios.sh maestro

      - name: Metro e pacote do app
        id: metro
        timeout-minutes: 20
        run: bash apps/mobile/conferencia-nativa/ios.sh metro

      # Daqui em diante, um fluxo que falha não impede os seguintes de tentar: cada um deixa as capturas que conseguiu.
      - name: "Fluxo 1: entrada, com o simulador como vem de fábrica"
        id: fluxo_entrada
        if: ${{ !cancelled() && steps.metro.outcome == 'success' }}
        timeout-minutes: 12
        run: bash apps/mobile/conferencia-nativa/ios.sh fluxo-entrada

      - name: Desligar o preenchimento automático de senhas do simulador
        id: sem_preenchimento
        if: ${{ !cancelled() && steps.metro.outcome == 'success' }}
        timeout-minutes: 12
        run: bash apps/mobile/conferencia-nativa/ios.sh sem-preenchimento

      - name: "Fluxo 2: entrar na conta sintética"
        id: fluxo_entrar
        if: ${{ !cancelled() && steps.sem_preenchimento.outcome == 'success' }}
        timeout-minutes: 12
        run: bash apps/mobile/conferencia-nativa/ios.sh fluxo-entrar

      - name: "Fluxos das telas: mapa, Minhas trilhas, exercícios, Explorar e Perfil"
        id: fluxo_telas
        if: ${{ !cancelled() && steps.fluxo_entrar.outcome == 'success' }}
        # Dez fluxos, cada um reabrindo o app; levou 31 minutos na execução 44511779137, antes da cache do Metro.
        timeout-minutes: 45
        run: bash apps/mobile/conferencia-nativa/ios.sh fluxo-telas

      # `always()`: mesmo cancelada (um envio novo, o tempo do job), a execução guarda o que conseguiu.
      - name: Juntar as capturas e dizer o que faltou
        if: ${{ always() && steps.sonda.outcome == 'success' }}
        run: bash apps/mobile/conferencia-nativa/ios.sh coletar

      - name: Guardar as capturas (3 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-iphone
          path: ${{ runner.temp }}/conferencia/capturas
          retention-days: 3
          if-no-files-found: warn

      # Registros de cada programa, a saída do Maestro (com a tela e a árvore de elementos de cada falha) e os dados da
      # conta sintética. Sem o .env, sem chaves e sem as ferramentas baixadas.
      - name: Guardar os registros (3 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registros-iphone
          path: |
            ${{ runner.temp }}/conferencia/registros
            ${{ runner.temp }}/conferencia/maestro
            ${{ runner.temp }}/conferencia/dados
          retention-days: 3
          if-no-files-found: warn

  android:
    name: Android (emulador)
    # Rota A1 de docs/BUILD-ANDROID.md: o build de debug do projeto (com a CA local só no debug), num emulador com KVM.
    runs-on: ubuntu-latest
    # O primeiro build do Gradle, sem cache, é o passo mais longo; cada passo tem o próprio limite, abaixo deste.
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conferir os fluxos contra o código do app
        run: node apps/mobile/conferencia-nativa/conferir-fluxos.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Java 17 para o Gradle e o Maestro.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # O emulador precisa da aceleração do kernel (KVM) para ligar em minutos, e não em dezenas de minutos.
      - name: Liberar o KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sonda (versões, SDK do Android e KVM)
        id: sonda
        run: bash apps/mobile/conferencia-nativa/android.sh sonda

      - name: Instalar dependências
        run: npm ci

      # Gradle e o que ele baixa (wrapper, dependências, NDK do React Native): a segunda execução reaproveita.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('package-lock.json', 'apps/mobile/app.json', 'apps/mobile/plugins/**') }}
          restore-keys: gradle-android-

      - name: API local (banco, build, HTTPS e dados de demonstração)
        id: servidor
        timeout-minutes: 20
        run: bash apps/mobile/conferencia-nativa/android.sh servidor

      - name: Build de debug do app (prebuild e Gradle, com a CA local)
        id: app
        timeout-minutes: 50
        run: bash apps/mobile/conferencia-nativa/android.sh app

      - name: Maestro
        id: maestro
        timeout-minutes: 5
        run: bash apps/mobile/conferencia-nativa/android.sh maestro

      - name: Metro e pacote do app
        id: metro
        timeout-minutes: 20
        run: bash apps/mobile/conferencia-nativa/android.sh metro

      # O emulador só existe neste passo: a preparação dele (tela de 360 × 780 dp, barra fixa, APK, `adb reverse`) e os
      # três fluxos rodam aqui. Animações ligadas, como no iPhone (o Stu animado também é conferido). No emulador, cada
      # leitura da tela pelo Maestro leva de 7 a 20 s: o passo levou 57 min na execução 44565509060, com cinco fluxos
      # caindo cedo; com eles inteiros, passa de uma hora.
      - name: "Emulador: entrada, conta e telas"
        id: emulador
        if: ${{ !cancelled() && steps.app.outcome == 'success' && steps.metro.outcome == 'success' && steps.maestro.outcome == 'success' }}
        timeout-minutes: 90
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          disable-animations: false
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash apps/mobile/conferencia-nativa/android.sh no-emulador

      - name: Juntar as capturas e dizer o que faltou
        if: ${{ always() && steps.sonda.outcome == 'success' }}
        run: bash apps/mobile/conferencia-nativa/android.sh coletar

      - name: Guardar as capturas (3 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-android
          path: ${{ runner.temp }}/conferencia/capturas
          retention-days: 3
          if-no-files-found: warn

      - name: Guardar os registros (3 dias)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registros-android
          path: |
            ${{ runner.temp }}/conferencia/registros
            ${{ runner.temp }}/conferencia/maestro
            ${{ runner.temp }}/conferencia/dados
          retention-days: 3
          if-no-files-found: warn

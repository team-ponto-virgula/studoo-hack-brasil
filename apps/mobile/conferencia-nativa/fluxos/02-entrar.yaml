# Entra com a conta sintética e captura o que o Studoo mostra logo depois. Roda com o preenchimento automático de senhas
# desligado no simulador: com ele ligado, digitar num campo de senha falha (problema conhecido do Maestro no iOS).
appId: host.exp.Exponent
name: 02-entrar
---
- runFlow: partes/abrir-pela-primeira-vez.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: login-email
# Logo depois de religar o simulador (sem_preenchimento, em ios.sh), o teclado chega frio, e na execução 44926124145 o
# primeiro texto se perdeu: "Input text" COMPLETED e o campo vazio ("Informe um e-mail válido"). Espera o teclado subir
# antes de digitar e confere o e-mail no campo; sem ele, apaga, toca de novo e digita uma vez mais. O runner conta as
# digitações e põe ⚠️ no resumo quando houve a segunda (fluxo_entrar, em comum.sh). O e-mail é o da conta sintética.
- waitForAnimationToEnd:
    timeout: 2500
- inputText: ${EMAIL}
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      notVisible:
        text: ${EMAIL}
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: login-email
      - eraseText: 60
      - waitForAnimationToEnd:
          timeout: 2500
      - inputText: ${EMAIL}
      - waitForAnimationToEnd:
          timeout: 1000
# Opcional: se o Maestro não enxergar o valor do campo, o aviso fica no registro (WARNED), sem derrubar o fluxo; a entrada
# mesmo se confere logo abaixo, pela barra de baixo depois do "Entrar".
- assertVisible:
    text: ${EMAIL}
    optional: true
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: login-senha
# Com `label`, a saída do Maestro mostra esta frase no lugar do texto digitado.
- waitForAnimationToEnd:
    timeout: 1500
- inputText:
    text: ${SENHA}
    label: Digitar a senha da conta sintética
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 04-entrada-preenchida
# O campo da senha envia pelo teclado (returnKeyType "go"). Se o Enter não enviar, o botão "Entrar" envia.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: nav-planos
    timeout: 25000
    optional: true
- runFlow:
    when:
      visible:
        id: entrar
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: entrar
# Com o preenchimento automático desligado, o iOS não oferece guardar a senha; se oferecer, a resposta é "agora não".
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# A barra de baixo, ou o aviso de falha da lista de trilhas. Na execução 44590901823, logo depois de entrar, o proxy da
# conferência devolveu 502 ("servidor fora do ar") para a lista de trilhas depois de 20 s; o app ficou no aviso, sem a
# barra, e o fluxo caiu, pulando todas as telas. A causa do 502 não ficou registrada. Com o aviso, um toque em "Tentar
# novamente" (partes/tentar-de-novo.yaml); se a falha continuar, a espera seguinte derruba o fluxo, como antes.
- extendedWaitUntil:
    visible:
      id: nav-planos|tentar-planos
    timeout: 60000
- runFlow: partes/tentar-de-novo.yaml
# Zera a conta do Maestro antes da espera da barra (ver partes/reabrir.yaml).
- evalScript: ${output.esperaDaBarra = true}
- extendedWaitUntil:
    visible:
      id: nav-planos
    timeout: 60000
# Zera a conta do Maestro (ver partes/reabrir.yaml): sem isto, a espera da barra de baixo consome a do mapa.
- evalScript: ${output.esperaDoMapa = true}
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-depois-de-entrar

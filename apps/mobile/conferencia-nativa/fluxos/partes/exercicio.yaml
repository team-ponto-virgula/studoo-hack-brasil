# Abre a trilha ${TRILHA} por Minhas trilhas, começa a lição atual, avança até o primeiro exercício e captura o estado
# inicial dele (${CAPTURA}) e o resto da tela (${CAPTURA}-abaixo). Não responde nada: o preparo dos dados deixou a
# lição atual de cada trilha começando pelo formato da captura. Não sai da lição no fim: o próximo fluxo reabre o app.
# Os toques e os arrastos esperam a tela parar no máximo 1,5 s e 1 s: o mapa e a lição têm animações que não param, e
# a espera padrão do Maestro chegava a 18 s por toque.
appId: host.exp.Exponent
---
- runFlow: reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-planos
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-planos
    timeout: 30000
# O botão do cartão tem o nome acessível "<ação>: <título da trilha>". No emulador de Android, cada passo da rolagem
# leva de 20 a 28 s (a árvore de elementos demora a vir): na execução 44565509060, os 45 s deram dois ou três passos, e
# só o botão da primeira das outras trilhas apareceu. O da última pede uns seis passos. No iPhone, a busca mais longa
# levou uns 20 s.
- scrollUntilVisible:
    element:
      text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
    direction: DOWN
    timeout: 240000
    speed: 50
    waitToSettleTimeoutMs: 500
# Centralizar em um passo à parte, curto e opcional. Na execução 45124630286 (Android, fluxo 30) o cartão era o ÚLTIMO da
# lista ("Culinária: receitas básicas"): achado em y 1272, a centralização o trouxe a 1116 e a lista acabou ali; o Maestro
# continuou tentando centralizar com o cartão parado até estourar os 240 s e terminou em "No visible element found", com
# o cartão à vista. No fim da lista o cartão já fica acima da barra de baixo (a folga do fim da rolagem), então a
# centralização que não anda só gasta os 45 s e segue (no emulador cada arrasto leva de 13 a 20 s).
- scrollUntilVisible:
    element:
      text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
    direction: DOWN
    timeout: 45000
    speed: 50
    centerElement: true
    waitToSettleTimeoutMs: 500
    optional: true
# A barra de baixo flutua por cima do conteúdo (iOS 26 e Android): a rolagem acima centraliza o botão, que fica longe
# da barra e da barra de status. Sem arrasto fixo depois: na execução 45113443824 (iPhone) a centralização já tinha
# levado o botão de y 678 a 138, e o arrasto de 15% o subiu até y 18–70, sob a barra de status; o toque ali rolou a lista
# de volta ao topo (o toque na barra de status faz isso no iOS) e o cartão sumiu de vista. Na execução 45098808095
# (Android), sem centralizar, o botão parou sob a barra de baixo.
- tapOn:
    waitToSettleTimeoutMs: 1500
    text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
# Pelo estado: se a lista continuar na tela, sem o mapa, o botão é procurado de novo (para baixo e, se ele tiver subido
# demais, para cima), centralizado num passo curto e opcional, e tocado mais uma vez.
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: titulo-planos
      notVisible:
        id: titulo-plano
    commands:
      - scrollUntilVisible:
          element:
            text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
          direction: DOWN
          timeout: 60000
          speed: 50
          waitToSettleTimeoutMs: 500
          optional: true
      - scrollUntilVisible:
          element:
            text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
          direction: UP
          timeout: 60000
          speed: 50
          waitToSettleTimeoutMs: 500
          optional: true
      - scrollUntilVisible:
          element:
            text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
          direction: DOWN
          timeout: 45000
          speed: 50
          centerElement: true
          waitToSettleTimeoutMs: 500
          optional: true
      - tapOn:
          waitToSettleTimeoutMs: 1500
          text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 45000
# O mapa rola sozinho até a lição atual. Com ela à vista, a ação é o próprio nó; fora da vista, o cartão "Próxima lição".
- waitForAnimationToEnd:
    timeout: 2000
- evalScript: ${output.abriuPeloCartao = false}
- runFlow:
    when:
      visible:
        id: comecar-licao
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: comecar-licao
      - evalScript: ${output.abriuPeloCartao = true}
- runFlow:
    when:
      true: ${output.abriuPeloCartao == false}
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          text: "(Começar|Continuar): .*"
# A lição pode não abrir com o servidor lento: na execução 45105021514 (iPhone, fluxo 33, carga ~470), o pedido da lição
# foi largado pelo app aos 15 s (499 no proxy) e o mapa mostrou "Confira a conexão e tente novamente." (tentar-planos).
# Pelo estado: com esse cartão, "Tentar novamente", o mapa de novo e a lição aberta outra vez (o cartão "Começar lição"
# ou o nó atual), uma vez.
- extendedWaitUntil:
    visible: 'Etapa \d+ de \d+'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible:
        id: tentar-planos
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: tentar-planos
      - extendedWaitUntil:
          visible:
            id: titulo-plano
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: comecar-licao
          commands:
            - tapOn:
                waitToSettleTimeoutMs: 1500
                id: comecar-licao
      - runFlow:
          when:
            notVisible:
              id: comecar-licao
            visible: "(Começar|Continuar): .*"
          commands:
            - tapOn:
                waitToSettleTimeoutMs: 1500
                text: "(Começar|Continuar): .*"
# Conceito e exemplo vêm antes do exercício: "Continuar lendo" enquanto houver texto abaixo, depois "Avançar". Só um dos
# dois botões existe por vez, então um toque só serve aos dois (o `id` é uma expressão regular). É opcional: enquanto a
# lição carrega, nenhum existe, e a espera do próprio toque cobre esse tempo.
- repeat:
    times: 24
    while:
      notVisible:
        id: pergunta-exercicio
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: "ler-mais|avancar-licao"
          optional: true
- extendedWaitUntil:
    visible:
      id: pergunta-exercicio
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${CAPTURA}
- swipe:
    waitToSettleTimeoutMs: 1000
    start: 50%, 70%
    end: 50%, 35%
    duration: 800
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${CAPTURA}-abaixo

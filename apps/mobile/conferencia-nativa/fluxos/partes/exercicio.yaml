# Abre a trilha ${TRILHA} por Minhas trilhas, começa a lição atual, avança até o primeiro exercício e captura o estado
# inicial dele (${CAPTURA}) e o resto da tela (${CAPTURA}-abaixo). Não responde nada: o preparo dos dados deixou a
# lição atual de cada trilha começando pelo formato da captura. Não sai da lição no fim: o próximo fluxo reabre o app.
# Os toques e os arrastos esperam a tela parar no máximo 1,5 s e 1 s: o mapa e a lição têm animações que não param, e
# a espera padrão do Maestro chegava a 18 s por toque.
appId: host.exp.Exponent
---
- runFlow: reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-planos
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-planos
    timeout: 30000
# O botão do cartão tem o nome acessível "<ação>: <título da trilha>". No emulador de Android, cada passo da rolagem
# leva de 20 a 28 s (a árvore de elementos demora a vir): na execução 44565509060, os 45 s deram dois ou três passos, e
# só o botão da primeira das outras trilhas apareceu. O da última pede uns seis passos. No iPhone, a busca mais longa
# levou uns 20 s.
- scrollUntilVisible:
    element:
      text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
    direction: DOWN
    timeout: 240000
    speed: 50
    waitToSettleTimeoutMs: 500
# No iOS 26 a barra de baixo fica por cima do conteúdo: o botão pode ter parado atrás dela. Sobe mais um pouco.
- swipe:
    waitToSettleTimeoutMs: 1000
    start: 50%, 55%
    end: 50%, 40%
    duration: 800
- tapOn:
    waitToSettleTimeoutMs: 1500
    text: "(Começar|Continuar|Rever trilha): ${TRILHA}"
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 45000
# O mapa rola sozinho até a lição atual. Com ela à vista, a ação é o próprio nó; fora da vista, o cartão "Próxima lição".
- waitForAnimationToEnd:
    timeout: 2000
- evalScript: ${output.abriuPeloCartao = false}
- runFlow:
    when:
      visible:
        id: comecar-licao
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: comecar-licao
      - evalScript: ${output.abriuPeloCartao = true}
- runFlow:
    when:
      true: ${output.abriuPeloCartao == false}
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          text: "(Começar|Continuar): .*"
# Conceito e exemplo vêm antes do exercício: "Continuar lendo" enquanto houver texto abaixo, depois "Avançar". Só um dos
# dois botões existe por vez, então um toque só serve aos dois (o `id` é uma expressão regular). É opcional: enquanto a
# lição carrega, nenhum existe, e a espera do próprio toque cobre esse tempo.
- repeat:
    times: 24
    while:
      notVisible:
        id: pergunta-exercicio
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: "ler-mais|avancar-licao"
          optional: true
- extendedWaitUntil:
    visible:
      id: pergunta-exercicio
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${CAPTURA}
- swipe:
    waitToSettleTimeoutMs: 1000
    start: 50%, 70%
    end: 50%, 35%
    duration: 800
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${CAPTURA}-abaixo

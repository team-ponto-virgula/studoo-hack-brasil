# Recomeça o app do zero, com a sessão que já existe: fecha o Expo Go, abre o projeto de novo e espera a barra de baixo
# e o mapa da trilha em andamento (é onde o Studoo abre para quem tem trilhas). Cada fluxo de `telas/` começa por aqui,
# para não depender de onde o fluxo anterior parou (uma folha aberta, uma lição pela metade).
appId: host.exp.Exponent
---
# O simulador às vezes não abre o link a tempo com a máquina carregada ("Simulator device failed to open exp://127.0.0.1:8081.
# Operation timed out", fluxos 40 e 62 da execução 44809026116, antes de qualquer tela do app): até duas tentativas a mais.
- retry:
    maxRetries: 2
    commands:
      - stopApp
      - openLink: exp://127.0.0.1:8081
# A pergunta do iOS sobre abrir o link no Expo Go, respondida no primeiro fluxo, não voltou nas reaberturas da execução
# 44511779137; conferir a cada vez custava uns 9 s.
# Depois de religar o simulador, a apresentação do Expo Go pode voltar: a mesma defesa da primeira abertura. O pacote vem
# da cache na frente do Metro (servidor/cache-do-metro.mjs), já pronto, então a espera é menor.
- runFlow:
    file: sair-do-menu-do-expo-go.yaml
    env:
      ESPERA: "120000"
- extendedWaitUntil:
    visible:
      id: nav-planos
    timeout: 30000
# O Maestro desconta de toda espera pelo que está na tela, mesmo com `timeout`, o tempo passado desde o último comando que
# ele conta como interação (adjustedToLatestInteraction, no Orchestra.kt da 2.12.1), e as esperas acima não contam. Na
# execução 44565509060, o app levou 37 s para abrir e o mapa do fluxo 70 ficou com 6 s dos 45. O `evalScript` conta como
# interação e não toca no aparelho: zera a conta antes da espera do mapa.
- evalScript: ${output.esperaDoMapa = true}
# O mapa, ou o erro da abertura: na execução 45071340280 (fluxo 20), o servidor local devolveu 502 a um GET /api/sessao
# (o seguinte, 200 em 5,7 s) e o app ficou em "Não foi possível continuar. Tente novamente." (sessao.tsx, tentar-sessao),
# ou no aviso da lista (tentar-planos). Um toque em "Tentar novamente", uma vez, e a espera do mapa de novo.
- extendedWaitUntil:
    visible:
      id: titulo-plano|tentar-sessao|tentar-planos
    timeout: 45000
- runFlow:
    when:
      visible:
        id: tentar-sessao
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: tentar-sessao
- runFlow: tentar-de-novo.yaml
# Com o servidor lento ou com um 502, o app abre a lista e não o mapa: ele busca a lista e depois o detalhe da trilha em
# andamento, e, se o detalhe falha, fica em Minhas trilhas sem erro (estudo.tsx, carregarPlanos). Na execução 45084470018
# (fluxo 55) a espera acima acabou com "Minhas trilhas" na tela. Aí o mapa abre pelo destaque ("Continuar: …").
- runFlow:
    when:
      visible:
        id: titulo-planos
      notVisible:
        id: titulo-plano
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: abrir-destaque
      - extendedWaitUntil:
          visible:
            id: titulo-plano|tentar-sessao|tentar-planos
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: tentar-sessao
          commands:
            - tapOn:
                waitToSettleTimeoutMs: 1500
                id: tentar-sessao
      - runFlow: tentar-de-novo.yaml
- evalScript: ${output.esperaDoMapaDepois = true}
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 60000
# A barra de baixo some enquanto o app espera um pedido (estudo.tsx: comNavegacaoAgora pede !pendente). Na execução
# 45084470018 (fluxo 40), com pedidos de 3 a 23 s, o mapa estava na tela sem a barra, e o toque em nav-explorar não achou
# nada. Os fluxos tocam na barra logo depois daqui: ela precisa estar de volta.
- extendedWaitUntil:
    visible:
      id: nav-planos
    timeout: 90000

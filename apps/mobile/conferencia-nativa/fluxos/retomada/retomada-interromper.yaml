appId: host.exp.Exponent
name: retomada-interromper
---
# Começa na sessão que o fluxo 02 abriu. A queda da resposta é externa ao app.
- tapOn:
    id: nav-objetivo
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: objetivo-estudo
    timeout: 30000
- tapOn:
    id: objetivo-estudo
    waitToSettleTimeoutMs: 1500
- inputText: Astronomia para observar o ceu noturno
- tapOn:
    id: gerar-trilha
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: consentimento-ia-titulo|diagnostico-pular
    timeout: 30000
- runFlow:
    when:
      visible:
        id: consentimento-ia-titulo
    commands:
      - tapOn:
          id: confirmacao-confirmar
          waitToSettleTimeoutMs: 1500
- evalScript: ${output.esperaDoDiagnostico = true}
- extendedWaitUntil:
    visible:
      id: diagnostico-pular
    timeout: 30000
- tapOn:
    id: diagnostico-pular
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: comecar-trilha
    timeout: 90000
- assertVisible: 'Sua proposta tem 10 lições em 3 partes\.'
- takeScreenshot: 86-retomada-proposta
- tapOn:
    id: comecar-trilha
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: criacao-verificar
    timeout: 30000
- assertVisible: 'Ainda não conseguimos confirmar se sua trilha foi salva\.'
- assertNotVisible: 'Sem conexão.*'
- tapOn:
    id: criacao-verificar
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: 'Verificar status'
    timeout: 15000
- assertVisible: 'Ainda não conseguimos confirmar se sua trilha foi salva\.'
- takeScreenshot: 87-retomada-sem-confirmacao
- stopApp

# Os momentos 2 e 3 da demo no aparelho, na trilha temporária da prova da criação (o Lead aprovou em 21/11, pedido
# 9bfe8743). Roda logo depois do fluxo 95, que deixou a primeira lição com o primeiro exercício acertado. Sem vídeo.
#   - "erro → ponte": recomeça a lição, erra o primeiro exercício (RESPOSTA_ERRADA), abre "Ver outro jeito de entender" e
#     fotografa o passo 1 da ponte e o desafio.
#   - "Ensine ao Stu" em texto: volta ao exercício, acerta (RESPOSTA_CERTA), abre o convite do Explique, escreve uma
#     explicação de ~130 caracteres, envia e fotografa o caderno do Stu (o retorno em quatro cartões).
# As opções vêm de servidor/resposta-da-prova.mjs, como no fluxo 95. O desafio da ponte não é respondido: a ponte nasce
# no servidor na hora do erro e o gabarito dela não é conhecido antes; a prova é a ponte aberta e o caminho de volta.
# No iPhone sempre (depois do 95); no Android só depois de a criação passar e com o emulador nunca religado (REVIVIDOS=0).
appId: host.exp.Exponent
name: 98-ponte-e-ensine
---
# Do exercício acertado para o mapa e de volta à mesma lição, que reabre onde parou, com o aviso e "Recomeçar".
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: voltar-plano
- extendedWaitUntil:
    visible:
      id: titulo-plano
    timeout: 30000
- evalScript: ${output.abriuPeloNo = false}
- runFlow:
    when:
      visible:
        id: comecar-licao
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: comecar-licao
      - evalScript: ${output.abriuPeloNo = true}
- runFlow:
    when:
      true: ${output.abriuPeloNo == false}
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          text: "(Começar|Continuar): .*"
- extendedWaitUntil:
    visible: 'Etapa \d+ de \d+'
    timeout: 30000
# A lição reabre no exercício já acertado e, com a avaliação de volta, rola até o fim dele (licao.tsx, como a web em
# aula.tsx): o aviso de "continuou de onde parou" fica sob o topo da lição. O iPhone ainda o dá como visível, e o toque
# caía no topo sem abrir a confirmação (execuções 45933651982, 45935451042 e 45942548694). No Android, escondido, o
# recomeço seria pulado e o fluxo tentaria responder o exercício já respondido. Espera a rolagem acabar e volta ao alto.
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    waitToSettleTimeoutMs: 1000
    start: 50%, 35%
    end: 50%, 80%
    duration: 800
- swipe:
    waitToSettleTimeoutMs: 1000
    start: 50%, 35%
    end: 50%, 80%
    duration: 800
# "Recomeçar do zero" pede confirmação no mesmo lugar (recomecar-licao vira confirmar-recomeco).
- runFlow:
    when:
      visible:
        id: recomecar-licao
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1000
          id: recomecar-licao
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: confirmar-recomeco
# Pelo conceito e pelo exemplo até o primeiro exercício.
- repeat:
    while:
      notVisible:
        id: pergunta-exercicio
    times: 10
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: ler-mais|avancar-licao
          optional: true
- extendedWaitUntil:
    visible:
      id: pergunta-exercicio
    timeout: 15000
# O erro e a ponte.
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: opcao-${RESPOSTA_ERRADA}
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: enviar-resposta
- extendedWaitUntil:
    visible:
      id: ver-outro-jeito
    timeout: 30000
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: ver-outro-jeito
- extendedWaitUntil:
    visible:
      id: ponte-ver-exemplo
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 98-ponte-passo-1
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: ponte-ver-exemplo
- extendedWaitUntil:
    visible:
      id: ponte-ir-desafio
    timeout: 15000
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: ponte-ir-desafio
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 98-ponte-desafio
# De volta ao exercício, que fica limpo para a nova tentativa.
- scrollUntilVisible:
    element:
      id: ponte-voltar|ponte-voltar-rodape
    direction: DOWN
    timeout: 10000
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: ponte-voltar|ponte-voltar-rodape
- extendedWaitUntil:
    visible:
      id: pergunta-exercicio
    timeout: 15000
# O acerto e o "Ensine ao Stu".
- runFlow:
    when:
      visible:
        id: tentar-de-novo
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: tentar-de-novo
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: opcao-${RESPOSTA_CERTA}
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: enviar-resposta
- extendedWaitUntil:
    visible:
      id: continuar-licao
    timeout: 30000
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: continuar-licao
# A lição de frações tem uma lacuna depois da múltipla escolha. Só a prova do iPhone fornece esse gabarito.
- runFlow:
    when:
      true: ${typeof RESPOSTA_LACUNA !== "undefined" && RESPOSTA_LACUNA !== "ausente"}
    commands:
      - scrollUntilVisible:
          element:
            id: resposta-licao
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: resposta-licao
      - inputText: ${RESPOSTA_LACUNA}
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: enviar-resposta
      - extendedWaitUntil:
          visible:
            id: continuar-licao
          timeout: 30000
      - assertNotVisible:
          id: tentar-de-novo
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: continuar-licao
- extendedWaitUntil:
    visible:
      id: titulo-ensino
    timeout: 30000
# No iPhone, o Maestro pode considerar visível o campo atrás do rodapé preso.
- runFlow:
    when:
      true: ${PLATAFORMA == "iphone"}
    commands:
      - scrollUntilVisible:
          element:
            id: ensino-texto
          direction: DOWN
          centerElement: true
          timeout: 10000
      - tapOn:
          id: ensino-texto
      - inputText: "O denominador conta as partes iguais do inteiro e o numerador as escolhidas. Numa pizza de 8 fatias, comer 3 é 3/8."
      - assertVisible:
          id: ensino-texto
          text: '.*numerador as escolhidas.*'
      - assertVisible:
          id: enviar-explicacao
          enabled: true
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 99-ensine-explicacao-escrita
      # O botão fica no rodapé do formulário, acima do teclado.
      - tapOn:
          waitToSettleTimeoutMs: 1500
          id: enviar-explicacao
      - scrollUntilVisible:
          element:
            text: '^O que fez sentido$'
          direction: DOWN
          centerElement: true
          timeout: 30000
      - assertVisible: '^O que fez sentido$'
      - assertNotVisible:
          id: proxima-licao
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 99-ensine-retorno-do-stu
- runFlow:
    when:
      true: ${typeof PLATAFORMA === "undefined" || PLATAFORMA !== "iphone"}
    commands:
      - scrollUntilVisible:
          element:
            id: ensino-texto
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: ensino-texto
      - inputText: "O denominador conta as partes iguais do inteiro e o numerador as escolhidas. Numa pizza de 8 fatias, comer 3 é 3/8."
      # O teclado fica aberto: a tela rola até o botão e o toque passa (keyboardShouldPersistTaps="handled" na Tela).
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 99-ensine-explicacao-escrita
      - scrollUntilVisible:
          element:
            text: "Enviar minha explicação"
          direction: DOWN
          timeout: 10000
      - tapOn:
          waitToSettleTimeoutMs: 1500
          text: "Enviar minha explicação"
      - extendedWaitUntil:
          visible:
            id: caderno-do-stu
          timeout: 30000
      - scrollUntilVisible:
          element:
            id: caderno-do-stu
          direction: DOWN
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 99-ensine-retorno-do-stu

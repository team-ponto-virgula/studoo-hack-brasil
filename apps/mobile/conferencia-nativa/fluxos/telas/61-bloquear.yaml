# Spec 14, S9/S10 no simulador: bloquear quem publicou pelo "•••" do cartão no Explorar, confirmar, ver o aviso e desfazer.
appId: host.exp.Exponent
name: 61-bloquear
---
- runFlow: ../partes/reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-explorar
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-explorar
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Mais opções de .*"
    direction: DOWN
    timeout: 60000
    speed: 50
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Mais opções de .*"
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Bloquear .*"
- extendedWaitUntil:
    visible:
      id: confirmacao-confirmar
    timeout: 10000
- takeScreenshot: 61-bloquear-confirmacao
# O aviso "Pessoa bloqueada." com "Desfazer" fica 7 s (DURACAO_DO_AVISO_COM_ACAO_MS, interface.tsx). Na execução
# 45053145066, a espera pelo texto leu a árvore uma vez só: o driver levou 11,3 s para devolver a hierarquia do Explorar
# recarregado (getHierarchyWithFallback, 19:13:37,36 a 19:13:48,66), e o aviso saiu nesse meio. A captura da tela é rápida
# (~0,2 s): ela vem logo depois do toque, e a leitura do texto fica depois, opcional (no registro, WARNED se não o leu).
- tapOn:
    waitToSettleTimeoutMs: 500
    id: confirmacao-confirmar
- takeScreenshot: 61-bloquear-aviso
- assertVisible:
    text: "Pessoa bloqueada."
    optional: true
# Desfaz: a conta sintética volta a ver a pessoa, para os fluxos seguintes. O aviso some sozinho em poucos segundos e, com a
# máquina carregada, já tinha saído quando a captura acima terminou (execução 44809026116: "Element not found: Desfazer").
# Então: "Desfazer" se o aviso ainda estiver na tela; depois, sempre, a lista "Pessoas bloqueadas" do Perfil (S10), que
# desbloqueia o que tiver sobrado e tem de terminar vazia.
- runFlow:
    when:
      visible: "Desfazer"
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 500
          text: "Desfazer"
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-perfil
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-perfil
    timeout: 30000
- scrollUntilVisible:
    element:
      id: bloqueadas|bloqueadas-vazia
    direction: DOWN
    timeout: 120000
    speed: 50
    centerElement: true
    waitToSettleTimeoutMs: 500
# O botão de cada linha tem o nome acessível "Desbloquear <nome>" (desbloquearRotulo), e a regex de texto do Maestro casa o
# texto inteiro: "Desbloquear" sozinho não achava nada (execução 45077874039, com a lista na tela). O toque vai por
# "Desbloquear .*" (o nome inteiro, no iPhone e na descrição do Android) e se repete enquanto a lista não fica vazia (uma
# pessoa por toque).
- repeat:
    times: 3
    while:
      notVisible:
        id: bloqueadas-vazia
    commands:
      - tapOn:
          waitToSettleTimeoutMs: 1000
          text: "Desbloquear .*"
          optional: true
      - extendedWaitUntil:
          visible:
            id: bloqueadas-vazia
          timeout: 8000
          optional: true
- extendedWaitUntil:
    visible:
      id: bloqueadas-vazia
    timeout: 15000

# Spec 14, S9/S10 no simulador: bloquear quem publicou pelo "•••" do cartão no Explorar, confirmar, ver o aviso e desfazer.
appId: host.exp.Exponent
name: 61-bloquear
---
- runFlow: ../partes/reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-explorar
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-explorar
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Mais opções de .*"
    direction: DOWN
    timeout: 60000
    speed: 50
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Mais opções de .*"
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Bloquear .*"
- extendedWaitUntil:
    visible:
      id: confirmacao-confirmar
    timeout: 10000
- takeScreenshot: 61-bloquear-confirmacao
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: confirmacao-confirmar
- extendedWaitUntil:
    visible:
      text: "Pessoa bloqueada."
    timeout: 15000
- takeScreenshot: 61-bloquear-aviso
# Desfaz na hora: a conta sintética volta a ver a pessoa, para os fluxos seguintes.
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Desfazer"
- extendedWaitUntil:
    visible:
      text: "Pessoa desbloqueada."
    timeout: 15000

# Perfil, Privacidade (Apple 5.1.2(i)) e Excluir conta (5.1.1(v)) na conta sintética. Com IA=falsa no piloto nada sai do
# servidor: a seção Privacidade mostra só a frase da IA simulada (privacidade-estado). Desde o refino do app (spec 16, item
# 19) a política de privacidade fica só em Ajuda (o fluxo 63 a cobre, ajuda-politica), e "Excluir conta" (item 20) é o
# secundário vermelho depois de "Sair", na seção Conta, no fim do Perfil: a rolagem segue para baixo até ele. A exclusão abre
# o cartão destrutivo (antes: a ação desligada) e liga depois de digitar EXCLUIR (depois). O fluxo cancela: a conta sintética
# serve aos outros fluxos e não pode ser apagada.
appId: host.exp.Exponent
name: 55-privacidade
---
- runFlow: ../partes/reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-perfil
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-perfil
    timeout: 30000
# No emulador do Android (GPU por software), cada passo da rolagem leva de 18 a 26 s: na execução 45097385589 o Maestro
# achou privacidade-estado aos 111 s e o prazo de 120 s acabou na rolagem extra que centraliza o elemento. As rolagens do
# Perfil e do Explorar têm 300 s (no iPhone elas acabam em segundos; o prazo só pesa quando a máquina está lenta).
# A seção Privacidade no meio da tela, com o título acima da frase (a âncora era o botão da política, que saiu da seção).
# A rolagem é opcional (a centralização pode estourar o prazo com o elemento já à vista); o que decide é a frase à vista.
- scrollUntilVisible:
    element:
      id: privacidade-estado
    direction: DOWN
    timeout: 300000
    optional: true
    speed: 50
    centerElement: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: privacidade-estado
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 55-perfil-privacidade
- scrollUntilVisible:
    element:
      id: excluir-conta
    direction: DOWN
    timeout: 300000
    speed: 50
    centerElement: true
    waitToSettleTimeoutMs: 500
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: excluir-conta
- extendedWaitUntil:
    visible:
      id: excluir-conta-confirmacao
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 56-excluir-conta-confirmacao
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: excluir-conta-campo
- inputText: EXCLUIR
- waitForAnimationToEnd:
    timeout: 1500
# A prova do conserto do teclado (feat/refino-app 22ce2de: o cartão sobe para cima do teclado, com os botões presos): com o
# teclado AINDA ABERTO, "Excluir para sempre" (confirmacao-confirmar) e "Cancelar" (confirmacao-cancelar) estão na árvore.
# Obrigatório nas duas plataformas. No Android, o que fica atrás do teclado sai da árvore (execução 45077874039: cartão até
# y=1253, teclado a partir de 962, nenhum dos dois botões achado), então achar os dois é achá-los acima do teclado. A
# espera (até 15 s) cobre a subida do cartão depois de o teclado abrir; se faltar, o Maestro guarda a hierarquia da falha.
- extendedWaitUntil:
    visible:
      id: confirmacao-confirmar
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: confirmacao-cancelar
    timeout: 15000
# A captura com o teclado aberto e os dois botões à vista.
- takeScreenshot: 57-excluir-conta-digitado
# Só depois da prova o teclado fecha no Android, para o cancelamento seguir como antes (com o teclado aberto, o Voltar
# fecha só o teclado, não o cartão). O iPhone não precisa: lá o toque em Cancelar já passava com o teclado aberto.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: confirmacao-cancelar
# Só a arrumação depois das capturas: na execução 44809026116, o cartão ainda estava na árvore ao fim da espera, com as três
# capturas já feitas; o fluxo seguinte reabre o app de qualquer jeito.
- extendedWaitUntil:
    notVisible:
      id: excluir-conta-confirmacao
    timeout: 15000
    optional: true

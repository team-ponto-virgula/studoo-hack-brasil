# Conjunto das telas: um fluxo por tela, na ordem abaixo. Cada um recomeça o app, então a falha de um não derruba o próximo.
flows:
  - '*'
executionOrder:
  continueOnFailure: true
  flowsOrder:
    # Primeiro, a conferência da correção 37c302e ("Continuar lendo"), no ramo conferencia/continuar-lendo-iphone.
    - 70-exemplo-curto
    - 72-exemplo-longo
    - 10-mapa
    - 20-minhas-trilhas
    - 30-exercicio-ordenar
    - 31-exercicio-associar
    - 32-exercicio-multipla-escolha
    - 33-exercicio-verdadeiro-falso
    - 34-exercicio-lacuna
    - 35-exercicio-aberta
    - 40-explorar
    - 50-perfil
    - 60-configuracoes

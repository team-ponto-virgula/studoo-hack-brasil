# Spec 14, S13 no simulador: a seção Ajuda do Perfil (Falar com o suporte, Regras da comunidade, Política de privacidade).
appId: host.exp.Exponent
name: 63-ajuda
---
- runFlow: ../partes/reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-perfil
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-perfil
    timeout: 30000
# No emulador do Android (GPU por software), cada passo da rolagem leva de 18 a 26 s: na execução 45097385589 o Maestro
# achou privacidade-estado aos 111 s e o prazo de 120 s acabou na rolagem extra que centraliza o elemento. As rolagens do
# Perfil e do Explorar têm 300 s (no iPhone elas acabam em segundos; o prazo só pesa quando a máquina está lenta).
- scrollUntilVisible:
    element:
      id: ajuda-suporte
    direction: DOWN
    timeout: 300000
    speed: 50
    centerElement: true
- assertVisible:
    id: ajuda-regras
- assertVisible:
    id: ajuda-politica
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 63-perfil-ajuda

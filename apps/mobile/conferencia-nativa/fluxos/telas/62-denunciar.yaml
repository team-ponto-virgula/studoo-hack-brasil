# Spec 14, S4 no simulador: denunciar uma trilha pelo "•••" do cartão e ver o aviso com o protocolo (e a ação Bloquear).
appId: host.exp.Exponent
name: 62-denunciar
---
- runFlow: ../partes/reabrir.yaml
- tapOn:
    waitToSettleTimeoutMs: 1500
    id: nav-explorar
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: titulo-explorar
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Mais opções de .*"
    direction: DOWN
    timeout: 60000
    speed: 50
    centerElement: true
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Mais opções de .*"
- tapOn:
    waitToSettleTimeoutMs: 1000
    text: "Denunciar"
- extendedWaitUntil:
    visible:
      id: denuncia-spam
    timeout: 10000
- tapOn:
    waitToSettleTimeoutMs: 500
    id: denuncia-spam
- takeScreenshot: 62-denuncia-motivo
# O aviso com o protocolo é passageiro (7 s com ação, interface.tsx) e a leitura da árvore do Explorar leva ~10 s no
# simulador (como no 61, execução 45053145066): a captura vem logo depois do toque e a leitura do texto fica opcional.
- tapOn:
    waitToSettleTimeoutMs: 500
    id: denuncia-enviar
- takeScreenshot: 62-denuncia-protocolo
- assertVisible:
    text: "Denúncia enviada \\(protocolo .*"
    optional: true
